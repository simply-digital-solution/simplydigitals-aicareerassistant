name: Website CI

on:
  workflow_call:
    inputs:
      run_deploy:
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:                   { required: false }
      AWS_SECRET_ACCESS_KEY:               { required: false }
      AWS_REGION:                          { required: false }
      WEBSITE_S3_BUCKET:                   { required: false }
      WEBSITE_CLOUDFRONT_DISTRIBUTION_ID:  { required: false }

permissions:
  contents: read

jobs:

  # ── DEPLOY — merge to main ────────────────────────────────────────────────
  deploy:
    name: Deploy website to S3
    runs-on: ubuntu-latest
    if: inputs.run_deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync website files to S3
        run: |
          aws s3 sync website/ s3://${{ secrets.WEBSITE_S3_BUCKET }}/ \
            --exclude "setup-aws.sh" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          if [ -n "${{ secrets.WEBSITE_CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id ${{ secrets.WEBSITE_CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*"
          else
            echo "No WEBSITE_CLOUDFRONT_DISTRIBUTION_ID set — skipping invalidation"
          fi
